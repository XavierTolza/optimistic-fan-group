stages:
  - lint
  - test
  - validate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  HA_CORE_TAG: "2026.2.3"

cache:
  paths:
    - .pip-cache/

.base-python:
  image: python:3.13-slim
  before_script:
    - pip install --upgrade pip

lint:flake8:
  extends: .base-python
  stage: lint
  script:
    - pip install flake8
    - flake8 custom_components/optimistic_fan_group tests --max-line-length=100 --extend-ignore=E501,W503

lint:black:
  extends: .base-python
  stage: lint
  script:
    - pip install black
    - black --check custom_components/optimistic_fan_group tests

test:pytest:
  extends: .base-python
  stage: test
  script:
    - pip install -r requirements_test.txt
    - python -m pytest tests -q

validate:hassfest:
  extends: .base-python
  stage: validate
  before_script:
    - pip install --upgrade pip ruff
    - git clone --depth 1 --branch "$HA_CORE_TAG" https://github.com/home-assistant/core.git /tmp/ha-core
  script:
    - cd /tmp/ha-core
    - PYTHONPATH=/tmp/ha-core:/tmp/ha-core/script python -m script.hassfest
      --integration-path "$CI_PROJECT_DIR/custom_components/optimistic_fan_group"

validate:hacs:
  stage: validate
  image: ghcr.io/hacs/action:main
  allow_failure: true